---
layout: default
---

<h1>PowerShell Search</h1>

<p>I ♥ PS 7.3.6 > Hello PowerShell enthusiasts</p>

<form action="/search.html" method="get">
  <label for="search-box"></label>
  <input type="text" id="search-box" name="query">
  <input type="submit" value="search">
</form>

<p><div id="search-results"></div></p>

<script>
  {% assign documents = site.posts | concat: site.wiki %}

  window.store = {
    {% for post in documents %}
      {{ post.url | jsonify }}: {
        "title": {{ post.title | jsonify }},
        "author": {{ post.author | jsonify }},
        "category": {{ post.categories | join: ", " | jsonify }},
        "tags": {{ post.tags | join: ", " | jsonify }},
        "content": {{ post.content | strip_html | strip_newlines | jsonify }},
        "url": {{ post.url | relative_url | jsonify }},
        "collection": {{ post.collection | jsonify }},
        "date": {{ post.date | date: "%Y-%m-%d" | jsonify }}
      }
      {% unless forloop.last %},{% endunless %}
    {% endfor %}
  };
</script>
<script src="/js/lunr.min.js"></script>
<script src="/js/search.js"></script>

<p>
With a Little Help from <a href="https://learn.cloudcannon.com/jekyll/jekyll-search-using-lunr-js/" target="_blank">Jekyll search using lunr.js</a>
</p>
